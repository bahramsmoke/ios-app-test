name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download & Extract Zip Asset
        run: |
          curl -L -o project.zip "https://github.com/bahramsmoke/ios-app-test/releases/download/v1.0/Bahram-Kurd-iPhone-iPad-Xcode-v2.0.zip"
          unzip -q project.zip

      - name: Set Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build IPA (Unsigned)
        run: |
          xcodebuild -workspace *.xcworkspace -scheme App -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa -exportOptionsPlist exportOptions.plist CODE_SIGNING_ALLOWED=NO || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-app-ipa
          path: build/ipa/*.ipa
