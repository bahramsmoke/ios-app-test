name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & Extract Zip
        run: |
          curl -L -o project.zip "https://github.com/bahramsmoke/ios-app-test/releases/download/v1.0/Bahram-Kurd-iPhone-iPad-Xcode-v2.0.zip"
          unzip -q project.zip

      - name: Build IPA
        run: |
          mkdir -p build/ipa
          # اگر فایل app آماده وجود داشته باشد آن را تبدیل به ipa می‌کند
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            mkdir Payload
            cp -r "$APP_PATH" Payload/
            zip -r build/ipa/app.ipa Payload
          else
            # در غیر این صورت پروژه Xcode را کامپایل می‌کند
            xcodebuild build -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: |
            build/ipa/*.ipa
            **/*.ipa
