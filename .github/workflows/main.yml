name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/homebrew

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stream Extract ZIP Directly
        run: |
          curl -L "https://github.com/bahramsmoke/ios-app-test/releases/download/v1.0/Bahram-Kurd-iPhone-iPad-Xcode-v2.0.zip" | python3 -c "
          import sys, zipfile, io
          buffer = io.BytesIO(sys.stdin.buffer.read())
          with zipfile.ZipFile(buffer) as zip_ref:
              zip_ref.extractall('.')
          "

      - name: Build and Package IPA
        run: |
          mkdir -p build/ipa
          
          # پیدا کردن تمام پروژه‌ها یا فایل‌های app
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Found existing .app bundle at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r build/ipa/BahramApp.ipa Payload
          else
            echo "Building Xcode project..."
            XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
            XCODEWORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
            
            if [ -n "$XCODEWORKSPACE" ]; then
              SCHEME=$(xcodebuild -workspace "$XCODEWORKSPACE" -list | grep -A 1 "Schemes:" | tail -n 1 | xstrip 2>/dev/null || echo "App")
              xcodebuild archive -workspace "$XCODEWORKSPACE" -scheme "$SCHEME" -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
            elif [ -n "$XCODEPROJ" ]; then
              SCHEME=$(xcodebuild -project "$XCODEPROJ" -list | grep -A 1 "Schemes:" | tail -n 1 | tr -d '[:space:]')
              xcodebuild archive -project "$XCODEPROJ" -scheme "$SCHEME" -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
            fi
            
            # تبدیل Archive به IPA
            if [ -d "build/App.xcarchive" ]; then
              mkdir -p Payload
              cp -r build/App.xcarchive/Products/Applications/*.app Payload/
              zip -r build/ipa/BahramApp.ipa Payload
            fi
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ipa/*.ipa
