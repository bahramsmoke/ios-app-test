name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Maximize Disk Space
        run: |
          echo "Removing heavy unnecessary components..."
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/homebrew
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stream Extract ZIP Directly
        run: |
          echo "Downloading and extracting directly in one step..."
          curl -L "https://github.com/bahramsmoke/ios-app-test/releases/download/v1.0/Bahram-Kurd-iPhone-iPad-Xcode-v2.0.zip" | python3 -c "
          import sys, zipfile, io
          buffer = io.BytesIO(sys.stdin.buffer.read())
          with zipfile.ZipFile(buffer) as zip_ref:
              zip_ref.extractall('.')
          "
          echo "Extraction complete."
          df -h

      - name: Build IPA
        run: |
          mkdir -p build/ipa
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found .app: $APP_PATH"
            mkdir Payload
            cp -r "$APP_PATH" Payload/
            zip -r build/ipa/app.ipa Payload
          else
            echo "Searching for Xcode project..."
            WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
            PROJECT=$(find . -name "*.xcodeproj" | head -n 1)
            if [ -n "$WORKSPACE" ]; then
              xcodebuild build -workspace "$WORKSPACE" -scheme "App" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO || true
            elif [ -n "$PROJECT" ]; then
              xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO || true
            fi
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: |
            build/ipa/*.ipa
            **/*.ipa
