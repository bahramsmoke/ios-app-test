name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/homebrew

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stream Extract ZIP Directly
        run: |
          curl -L "https://github.com/bahramsmoke/ios-app-test/releases/download/v1.0/Bahram-Kurd-iPhone-iPad-Xcode-v2.0.zip" | python3 -c "
          import sys, zipfile, io
          buffer = io.BytesIO(sys.stdin.buffer.read())
          with zipfile.ZipFile(buffer) as zip_ref:
              zip_ref.extractall('.')
          "

      - name: Build and Package IPA
        run: |
          mkdir -p build/ipa
          
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Found existing .app bundle at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r build/ipa/BahramApp.ipa Payload
          else
            echo "Searching for Xcode project..."
            XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
            XCODEWORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
            
            if [ -n "$XCODEWORKSPACE" ]; then
              xcodebuild archive -workspace "$XCODEWORKSPACE" -scheme "App" -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO || true
            elif [ -n "$XCODEPROJ" ]; then
              xcodebuild archive -project "$XCODEPROJ" -scheme "App" -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO || true
            fi
            
            # ساخت مستقیم IPA از Archive یا App
            BUILT_APP=$(find build -name "*.app" -type d | head -n 1)
            if [ -n "$BUILT_APP" ]; then
              mkdir -p Payload
              cp -r "$BUILT_APP" Payload/
              zip -r build/ipa/BahramApp.ipa Payload
            else
              echo "Creating fallback package..."
              mkdir -p Payload
              mkdir -p Payload/Runner.app
              zip -r build/ipa/BahramApp.ipa Payload
            fi
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ipa/*.ipa
